name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged tree
        uses: actions/checkout@v4

      - name: Build the release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 - "$TAG" "$GITHUB_REPOSITORY" <<'PY'
          import re
          import sys

          tag = sys.argv[1]
          version = tag[1:] if tag.startswith("v") else tag
          lines = open("CHANGELOG.md", encoding="utf-8").read().splitlines()
          start = None
          for i, line in enumerate(lines):
              if re.match(r"^##\s+v" + re.escape(version) + r"(\s|$)", line):
                  start = i
                  break
          if start is None:
              sys.exit("no CHANGELOG section for v" + version)
          end = len(lines)
          for j in range(start + 1, len(lines)):
              if re.match(r"^##\s", lines[j]):
                  end = j
                  break
          body = "\n".join(lines[start + 1:end]).strip()
          if not body:
              sys.exit("empty CHANGELOG section for v" + version)
          download = (
              "## Downloads / 下载\n\n"
              "- [Kobold-v" + version + "-win-x64.zip]"
              "(https://github.com/" + sys.argv[2] + "/releases/download/"
              + tag + "/Kobold-" + tag + "-win-x64.zip)\n"
          )
          with open("/tmp/release-notes.md", "w", encoding="utf-8") as out:
              out.write(body + "\n\n" + download)
          PY
        shell: bash

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it untouched."
            exit 0
          fi
          gh release create "$TAG" \
            "Releases/Kobold-${TAG}-win-x64.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Kobold ${TAG#v}" \
            --notes-file /tmp/release-notes.md \
            --verify-tag

      # Mirror the package to the public download site so the landing page,
      # latest.json and the stable link follow every release without hand work.
      # The server side (downloads/kobold/publish.sh) derives all four from the
      # zip itself, so this step only has to put the file there. Without the
      # secrets the step reports and exits 0: the GitHub release stays the
      # source of truth and a release never fails because the mirror is off.
      - name: Mirror the package to the download site
        env:
          SSH_KEY: ${{ secrets.ALIYUN_SSH_KEY }}
          HOST: ${{ secrets.ALIYUN_HOST }}
          USER_NAME: ${{ secrets.ALIYUN_USER }}
          PORT: ${{ secrets.ALIYUN_PORT }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$SSH_KEY" ] || [ -z "$HOST" ] || [ -z "$USER_NAME" ]; then
            echo "ALIYUN_SSH_KEY / ALIYUN_HOST / ALIYUN_USER are not set; skipping the mirror."
            exit 0
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          PORT=${PORT:-22}
          DEST=/www/wwwroot/api.zzrddforever.xyz/downloads/kobold
          ZIP="Kobold-${TAG}-win-x64.zip"
          scp -i ~/.ssh/deploy_key -P "$PORT" "Releases/${ZIP}" "$USER_NAME@$HOST:$DEST/.incoming/"
          ssh -i ~/.ssh/deploy_key -p "$PORT" "$USER_NAME@$HOST" \
            "cd $DEST && mv -f .incoming/${ZIP} . && bash publish.sh '${ZIP}' '${TAG#v}'"
